services:
  auth-app:
      image: sepra-auth:latest
      container_name: sepra-auth
      restart: unless-stopped
      ports:
        - "5080:8080"
      environment:
        - PORT=8080
  home-app:
    image: sepra-home:latest
    container_name: sepra-home
    restart: unless-stopped
    ports:
      - "5081:8080"
    environment:
      - PORT=8080

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sepra-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - auth-app
      - home-app
      - api-server